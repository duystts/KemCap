<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${subject}">Mời kích hoạt tài khoản</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
  <p>Xin chào <strong th:text="${fullName}">bạn</strong>,</p>
  <p>Trung tâm đã tạo tài khoản English 1-1 cho bạn. Bấm vào nút dưới đây để đặt mật khẩu và kích hoạt
    tài khoản. Link có hiệu lực trong <strong>72 giờ</strong>.</p>
  <p>
    <a th:href="${link}" href="#"
       style="display: inline-block; padding: 10px 18px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px;">
      Kích hoạt tài khoản
    </a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">Nếu nút không hoạt động, mở link sau:
    <span th:text="${link}">link</span></p>
  <p style="font-size: 13px; color: #6b7280;">Nếu bạn không biết về tài khoản này, hãy bỏ qua email.</p>
</body>
</html>
