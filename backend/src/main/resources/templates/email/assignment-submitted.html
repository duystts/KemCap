<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${subject}">Học viên đã nộp bài tập</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5; padding: 16px;">
  <div style="max-width: 600px; margin: 0 auto; background: #ffffff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px;">
    <h2 style="color: #2563eb; margin-top: 0;">Thông báo: Có bài tập mới cần chấm</h2>
    <p>Xin chào <strong th:text="${fullName}">Thầy/Cô</strong>,</p>
    <p>Học viên <strong th:text="${studentName}">Học viên</strong> vừa nộp bài làm cho bài tập được giao.</p>
    <p>Thầy/Cô vui lòng vào hệ thống để đọc bài, chấm điểm và gửi phản hồi cho học viên nhé.</p>

    <p style="margin-top: 24px;">
      <a th:href="${link}" href="#"
         style="display: inline-block; padding: 10px 20px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px; font-weight: bold;">
        Xem bài nộp & Chấm điểm
      </a>
    </p>
    <hr style="border: none; border-top: 1px solid #e5e7eb; margin: 24px 0;">
    <p style="font-size: 13px; color: #6b7280; margin: 0;">Nền tảng đào tạo tiếng Anh 1 kèm 1 cá nhân hóa (English 1-1 Platform).</p>
  </div>
</body>
</html>
