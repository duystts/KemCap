<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${subject}">Đặt lại mật khẩu</title>
</head>
<body style="font-family: Arial, sans-serif; color: #1f2937; line-height: 1.5;">
  <p>Xin chào,</p>
  <p>Chúng tôi nhận được yêu cầu đặt lại mật khẩu cho tài khoản English 1-1 của bạn. Link dưới đây có
    hiệu lực trong <strong>30 phút</strong> và chỉ dùng được một lần.</p>
  <p>
    <a th:href="${link}" href="#"
       style="display: inline-block; padding: 10px 18px; background: #2563eb; color: #ffffff; text-decoration: none; border-radius: 6px;">
      Đặt lại mật khẩu
    </a>
  </p>
  <p style="font-size: 13px; color: #6b7280;">Nếu bạn không yêu cầu, hãy bỏ qua email này — mật khẩu
    của bạn không thay đổi.</p>
</body>
</html>
