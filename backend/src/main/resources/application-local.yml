# Profile local: chạy với docker-compose.yml ở thư mục gốc — giá trị dev chỉ nằm ở đây (R12)
spring:
  datasource:
    password: ${DB_PASSWORD:app}

# tài liệu API chỉ mở ở dev; frontend cần để chạy gen:api
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

app:
  livekit:
    url: ${LIVEKIT_URL:ws://localhost:7880}
    api-key: ${LIVEKIT_API_KEY:devkey}
    api-secret: ${LIVEKIT_API_SECRET:secret}
  security:
    jwt-secret: ${JWT_SECRET:local-dev-secret-change-me-0123456789abcdef}
  providers:
    video: ${VIDEO_PROVIDER:livekit}
    email: ${EMAIL_PROVIDER:smtp}

logging:
  level:
    com.englishplatform: DEBUG
